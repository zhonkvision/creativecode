<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Echo of Aria</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <canvas id="cv-bg"></canvas>
<canvas id="cv-mid"></canvas>
<canvas id="cv-fg"></canvas>

<div id="start">
  <div class="si">
    <div class="si-kanji">洞窟</div>
    <div class="si-title">Echo of Aria</div>
    <div class="si-hr"></div>
    <p class="si-sub">
      Move the mouse to play the piano<br>
      Click to resonate the strings<br>
      Let the echo carry you away
    </p>
    <button class="si-btn" id="btn-enter">Enter · 入</button>
  </div>
</div>

<div id="chord-pads">
  <button class="pad" data-idx="0"><span class="pad-key" data-qw="A" data-az="Q">Q</span><span class="pad-k">静</span><span class="pad-n">Am</span></button>
  <button class="pad" data-idx="1"><span class="pad-key" data-qw="S" data-az="S">S</span><span class="pad-k">夢</span><span class="pad-n">Em</span></button>
  <button class="pad" data-idx="2"><span class="pad-key" data-qw="D" data-az="D">D</span><span class="pad-k">花</span><span class="pad-n">Fmaj7</span></button>
  <button class="pad" data-idx="3"><span class="pad-key" data-qw="F" data-az="F">F</span><span class="pad-k">雪</span><span class="pad-n">Cmaj</span></button>
  <button class="pad" data-idx="4"><span class="pad-key" data-qw="G" data-az="G">G</span><span class="pad-k">月</span><span class="pad-n">Dm</span></button>
  <button class="pad" data-idx="5"><span class="pad-key" data-qw="H" data-az="H">H</span><span class="pad-k">風</span><span class="pad-n">G</span></button>
</div>

<div id="cursor"></div>
    <script src="./chiptune-synth.js"></script>
    <script src="./script.js"></script>
  </body>
  
</html>
