<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Quiet Worlds - Ambient Pixel Piano (C418 vibes)</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <canvas id="world-canvas"></canvas>

<div id="ui-layer">
  <div id="title-bar">
    <h1>Quiet Worlds</h1>
    <span class="subtitle">an ambient piano experience</span>
  </div>

  <div id="info-display">
    <div class="info-line">NOTES <span class="info-val" id="info-notes">0</span></div>
    <div class="info-line">OCTAVE <span class="info-val" id="info-octave">4</span></div>
    <div class="info-line" style="margin-top:6px">MODE <span class="info-val" id="info-mode">listen</span></div>
  </div>

  <div id="wave-bar">
    <canvas id="waveform"></canvas>
  </div>

  <div id="note-display"></div>

  <div id="piano-container">
    <div id="piano"></div>
    <div id="piano-controls">
      <button class="piano-btn" id="btn-oct-down" title="Octave down">Oct -</button>
      <button class="piano-btn active" id="btn-dream" title="Auto-play melody">Dream</button>
      <button class="piano-btn" id="btn-oct-up" title="Octave up">Oct +</button>
    </div>
  </div>

  <div id="footer-links">
    <span>Quiet Worlds Ambient Piano</span>
  </div>
</div>

<div id="init-overlay">
  <h2>Quiet Worlds</h2>
  <span class="tagline">an ambient piano experience</span>
  <span class="hint">play the piano or let it dream for you</span>
  <button id="init-btn">Enter</button>
</div>

    <script src="./chiptune-synth.js"></script>
    <script src="./script.js"></script>
  </body>
  
</html>
