<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microsoft Windows 84 — CRT Phosphor Display</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020803;
      color: #00ff66;
      font-family: 'VT323', monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #crt-bezel {
      position: relative;
      width: 92vw;
      max-width: 820px;
      height: 92vh;
      max-height: 820px;
      border: 3px solid #00ff66;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.4), inset 0 0 25px rgba(0, 255, 102, 0.2);
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #020a04 radial-gradient(circle at center, rgba(0, 255, 102, 0.08) 0%, rgba(0, 0, 0, 0.95) 100%);
    }

    /* Green Scanline Grid Overlay */
    .scanlines-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.75) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 50;
    }

    /* Top Monitored Notice */
    .terminal-header {
      font-size: 22px;
      letter-spacing: 0.12em;
      text-shadow: 0 0 10px #00ff66;
      animation: textFlicker 4s infinite;
    }

    /* Center Graphic Container */
    .center-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      position: relative;
    }

    canvas#logo-canvas {
      width: 480px;
      height: 340px;
      max-width: 90vw;
      display: block;
      filter: drop-shadow(0 0 16px rgba(0, 255, 102, 0.5));
      cursor: crosshair;
    }

    .title-group {
      text-align: center;
      margin-top: 10px;
    }
    .sub-brand {
      font-size: 32px;
      letter-spacing: 0.1em;
      color: #00ff66;
      text-shadow: 0 0 8px #00ff66;
      line-height: 1;
    }
    .main-brand {
      font-size: 80px;
      font-weight: bold;
      letter-spacing: 0.05em;
      color: #00ff66;
      text-shadow: 0 0 15px #00ff66, -2px 0 #ff0055, 2px 0 #00ffff;
      line-height: 0.9;
      margin-bottom: 6px;
    }
    .japanese-sub {
      font-size: 24px;
      letter-spacing: 0.25em;
      color: #00cc55;
    }

    /* Footer Loading & Badge */
    .footer-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
    }
    .loading-label {
      font-size: 24px;
      letter-spacing: 0.15em;
      text-shadow: 0 0 8px #00ff66;
    }
    .progress-track {
      width: 320px;
      max-width: 80vw;
      height: 24px;
      border: 2px solid #00ff66;
      padding: 3px;
      box-shadow: 0 0 12px rgba(0, 255, 102, 0.3);
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: #00ff66;
      box-shadow: 0 0 10px #00ff66;
      width: 45%;
      animation: fillLoop 3s infinite ease-in-out;
    }
    @keyframes fillLoop {
      0% { width: 10%; margin-left: 0; }
      50% { width: 60%; margin-left: 30%; }
      100% { width: 10%; margin-left: 85%; }
    }

    /* WK Logo Stamp */
    .stamp-wk {
      position: absolute;
      right: 10px;
      bottom: 0px;
      border: 2px solid #00ff66;
      padding: 2px 8px;
      font-size: 22px;
      font-weight: 900;
      color: #00ff66;
      box-shadow: 0 0 8px #00ff66;
    }

    @keyframes textFlicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 0.95; }
      93% { opacity: 0.6; }
      94% { opacity: 1; }
      98% { opacity: 0.85; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>
  <div class="scanlines-overlay"></div>
  <div id="crt-bezel">
    <!-- Header -->
    <div class="terminal-header">
      &gt; This connection is monitored for your safety.
    </div>

    <!-- Center Logo & Brand -->
    <div class="center-stage">
      <canvas id="logo-canvas"></canvas>

      <div class="title-group">
        <div class="sub-brand">Microsoft&reg;</div>
        <div class="main-brand">Windows 84</div>
        <div class="japanese-sub">アメリカ製1984年</div>
      </div>
    </div>

    <!-- Footer Progress -->
    <div class="footer-bar">
      <div class="loading-label">Loading...</div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <div class="stamp-wk">WK</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('logo-canvas');
    const ctx = canvas.getContext('2d');

    let mouseX = 0;
    let mouseY = 0;
    let time = 0;

    let params = {
      slatCount: 16,
      tiltFactor: 0.25,
      chromaShift: 4.0,
      glowStrength: 1.0
    };

    function resize() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
    }
    window.addEventListener('resize', resize);
    resize();

    window.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseX = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
      mouseY = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
    });

    // Draw the 4-Pane Isometric Segmented Raster Logo
    function drawLogo() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.save();
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      const dw = w / window.devicePixelRatio;
      const dh = h / window.devicePixelRatio;

      time += 0.03;

      const cx = dw / 2 + mouseX * 10;
      const cy = dh / 2 + mouseY * 10;

      // 4 Quadrants Colors: TopLeft Red, TopRight Cyan, BottomLeft Blue, BottomRight Yellow
      const panes = [
        { offsetX: -75, offsetY: -65, color: '#ff3344', glow: '#ff3344', skew: -0.2 },
        { offsetX: 75, offsetY: -55, color: '#00ddff', glow: '#00ddff', skew: -0.2 },
        { offsetX: -85, offsetY: 65, color: '#0066ff', glow: '#0066ff', skew: -0.2 },
        { offsetX: 65, offsetY: 75, color: '#ffea00', glow: '#ffea00', skew: -0.2 }
      ];

      panes.forEach(pane => {
        const slatNum = params.slatCount;
        const slatH = 5;
        const slatGap = 4;
        const paneW = 110;

        for (let i = 0; i < slatNum; i++) {
          const slatY = (i - slatNum / 2) * (slatH + slatGap);
          // Waving curvature effect
          const wave = Math.sin(time + i * 0.3 + pane.offsetX * 0.05) * 5;
          const px = cx + pane.offsetX + (slatY * pane.skew) + wave;
          const py = cy + pane.offsetY + slatY;

          // RGB Split Chromatic Aberration Passes
          const chroma = params.chromaShift;

          // Red pass
          ctx.fillStyle = 'rgba(255, 0, 80, 0.4)';
          ctx.fillRect(px - paneW / 2 - chroma, py, paneW, slatH);

          // Cyan pass
          ctx.fillStyle = 'rgba(0, 240, 255, 0.4)';
          ctx.fillRect(px - paneW / 2 + chroma, py, paneW, slatH);

          // Core Phosphor Bar
          ctx.fillStyle = pane.color;
          ctx.shadowColor = pane.glow;
          ctx.shadowBlur = 10 * params.glowStrength;
          ctx.fillRect(px - paneW / 2, py, paneW, slatH);
          ctx.shadowBlur = 0;
        }
      });

      ctx.restore();
      requestAnimationFrame(drawLogo);
    }
    drawLogo();

    // Hot DNA Mutation listener via postMessage
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'DNA_MUTATION') {
        const p = e.data.parameters;
        if (p.rasterBarCount !== undefined) params.slatCount = Math.round(p.rasterBarCount / 2);
        if (p.rgbOffset !== undefined) params.chromaShift = p.rgbOffset;
      }
    });
  </script>
</body>
</html>
