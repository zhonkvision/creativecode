<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGL Glass Resonator Xylophone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050709;
      color: #F1F5F9;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      cursor: crosshair;
    }
    .hud-header {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 10;
      font-size: 11px;
      line-height: 1.5;
      background: rgba(5, 7, 9, 0.85);
      border: 1px solid #1E293B;
      padding: 10px 14px;
      pointer-events: none;
    }
    .hud-header strong { color: #00F0FF; }
    .hud-controls {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }
    button {
      background: #0C1015;
      border: 1px solid #1E293B;
      color: #25E86E;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    button:hover {
      background: #25E86E;
      color: #050709;
    }
    .hud-footer {
      position: absolute;
      bottom: 14px;
      left: 14px;
      z-index: 10;
      font-size: 10px;
      color: #64748B;
      border: 1px solid #1E293B;
      padding: 4px 8px;
      background: rgba(5, 7, 9, 0.8);
      pointer-events: none;
    }
  </style>
  <!-- Standalone Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-header">
    <div>WEBGL RESONATOR: <strong>FROSTED GLASS HELIX</strong></div>
    <div>INTERACTION: <strong>SWEEP CURSOR ACROSS BARS</strong></div>
    <div>VOICES: <span id="voicesVal" style="color: #25E86E;">36 BARS</span> &bull; AUDIO: <span id="audioStatus" style="color: #00F0FF;">READY</span></div>
  </div>

  <div class="hud-controls">
    <button id="soundToggleBtn">🔊 SOUND: ON</button>
  </div>

  <div class="hud-footer">
    CH-03-VECTOR-PERSPECTIVE &bull; REF-003 // SWEEP CURSOR TO PLAY
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050709, 0.005);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.set(0, 25, 70);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x050709, 1);
    container.appendChild(renderer.domElement);

    // Web Audio Synthesizer for Glass Bell Chimes
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let isSoundEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // Pentatonic scale frequencies
    const BASE_FREQS = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];

    function playGlassChime(pitchIndex) {
      if (!isSoundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const baseFreq = BASE_FREQS[pitchIndex % BASE_FREQS.length] * Math.pow(2, Math.floor(pitchIndex / BASE_FREQS.length));
      const now = audioCtx.currentTime;

      // Primary harmonic chime
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(baseFreq, now);

      // Overtone sparkle (pure glass bell overtone)
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(baseFreq * 2.76, now);

      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 1.25);
      osc2.stop(now + 1.25);
    }

    document.getElementById('soundToggleBtn').addEventListener('click', () => {
      isSoundEnabled = !isSoundEnabled;
      const btn = document.getElementById('soundToggleBtn');
      btn.innerText = isSoundEnabled ? '🔊 SOUND: ON' : '🔇 SOUND: OFF';
    });

    // Create Helical 3D Glass Xylophone Bars
    const barCount = 36;
    const bars = [];
    const barGroup = new THREE.Group();
    scene.add(barGroup);

    const barGeo = new THREE.BoxGeometry(14, 1.2, 3.5);

    for (let i = 0; i < barCount; i++) {
      const progress = i / barCount;
      const angle = progress * Math.PI * 3.5;
      const radius = 22;
      const y = (progress - 0.5) * 60;

      const mat = new THREE.MeshBasicMaterial({
        color: new THREE.Color().setHSL(progress * 0.7 + 0.3, 0.9, 0.6),
        wireframe: true,
        transparent: true,
        opacity: 0.8
      });

      const mesh = new THREE.Mesh(barGeo, mat);
      mesh.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
      mesh.rotation.y = -angle + Math.PI / 2;
      mesh.rotation.z = Math.sin(progress * Math.PI) * 0.2;
      mesh.userData = { index: i, originalColor: mat.color.clone(), hitTime: 0 };

      barGroup.add(mesh);
      bars.push(mesh);
    }

    // Raycaster for cursor sweeping
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-999, -999);
    let lastHitIndex = -1;

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      initAudio();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.01;

      // Slow idle helix rotation
      barGroup.rotation.y = time * 0.25;

      // Raycasting cursor over bars
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(bars);

      if (intersects.length > 0) {
        const hitBar = intersects[0].object;
        const idx = hitBar.userData.index;

        if (idx !== lastHitIndex) {
          lastHitIndex = idx;
          hitBar.userData.hitTime = 1.0;
          playGlassChime(idx);
        }
      } else {
        lastHitIndex = -1;
      }

      // Update hit animations
      for (const bar of bars) {
        if (bar.userData.hitTime > 0) {
          bar.userData.hitTime -= 0.04;
          bar.scale.set(1.15, 1.4, 1.15);
          bar.material.color.setHex(0xFFFFFF);
          bar.material.opacity = 1.0;
        } else {
          bar.scale.set(1.0, 1.0, 1.0);
          bar.material.color.copy(bar.userData.originalColor);
          bar.material.opacity = 0.75;
        }
      }

      // Camera parallax
      camera.position.x += (mouse.x * 20 - camera.position.x) * 0.05;
      camera.position.y += (25 + mouse.y * 15 - camera.position.y) * 0.05;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
